name: Joe Japan Cloudflare
on:
  push:
    branches: [joe-japan-cloudflare]
    paths:
      - 'sites/joe-japan/**'
      - '.github/workflows/joe-japan-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: joe-japan-cloudflare
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require authorized Cloudflare credentials
        shell: bash
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured for this repository. No Cloudflare deployment has occurred."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish only Joe's standalone site
        shell: bash
        run: |
          if [ ! -f sites/joe-japan/wrangler.jsonc ]; then
            echo '::notice::Cloudflare credentials are present. Site files are not committed yet; nothing was deployed.'
            exit 0
          fi
          npx --yes wrangler@4 deploy --config sites/joe-japan/wrangler.jsonc
      - name: Verify the public website
        if: ${{ hashFiles('sites/joe-japan/wrangler.jsonc') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/workers/subdomain'
          request = urllib.request.Request(endpoint, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          data = json.load(urllib.request.urlopen(request, timeout=30))
          if not data.get('success') or not data.get('result', {}).get('subdomain'):
              raise SystemExit('Could not verify the Cloudflare workers.dev subdomain. No live URL confirmed.')
          url = 'https://joe-japan-trip.' + data['result']['subdomain'] + '.workers.dev/'
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      html = response.read().decode()
                      assert response.status == 200 and 'Joe' in html and 'Tokyo' in html and 'Kyoto' in html
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(5)
          print('VERIFIED_LIVE_URL=' + url)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Verified public website\n\n' + url + '\n\nHTTP 200; Joe, Tokyo, and Kyoto content verified.\n')
          PY
